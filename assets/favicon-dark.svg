<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0b3a52"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深色圆角渐变底 -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#164e63" stroke-width="6"/>

  <!-- 顶部青色光晕 -->
  <ellipse cx="256" cy="120" rx="220" ry="150" fill="url(#halo)" opacity="0.8"/>

  <!-- 外环 -->
  <circle cx="256" cy="270" r="128" fill="none" stroke="#a5f3fc" stroke-width="30"/>
  <circle cx="256" cy="270" r="128" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="56"/>

  <!-- 刻度点 -->
  <circle cx="256" cy="128" r="13" fill="#a5f3fc"/>
  <circle cx="256" cy="412" r="13" fill="#22d3ee" fill-opacity="0.6"/>
  <circle cx="144" cy="270" r="13" fill="#22d3ee" fill-opacity="0.6"/>
  <circle cx="368" cy="270" r="13" fill="#22d3ee" fill-opacity="0.6"/>

  <!-- 中心菱形指针（高亮） -->
  <polygon points="256,196 300,256 256,344 212,256" fill="url(#pin)"/>
  <polygon points="256,196 300,256 256,270" fill="#ffffff" opacity="0.95"/>
</svg>
