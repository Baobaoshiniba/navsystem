<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角渐变底 -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>

  <!-- 顶部光晕 -->
  <ellipse cx="256" cy="120" rx="220" ry="150" fill="url(#glow)" opacity="0.5"/>

  <!-- 外环（导航/地球语义） -->
  <circle cx="256" cy="270" r="128" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="30"/>
  <circle cx="256" cy="270" r="128" fill="none" stroke="#e0f2fe" stroke-opacity="0.35" stroke-width="52"/>

  <!-- 指南针刻度点 -->
  <circle cx="256" cy="128" r="13" fill="#ffffff"/>
  <circle cx="256" cy="412" r="13" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="144" cy="270" r="13" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="368" cy="270" r="13" fill="#ffffff" fill-opacity="0.55"/>

  <!-- 中心菱形指针 -->
  <polygon points="256,196 300,256 256,344 212,256" fill="url(#pin)"/>
  <polygon points="256,196 300,256 256,270" fill="#ffffff" opacity="0.9"/>
</svg>
